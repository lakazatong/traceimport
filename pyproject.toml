[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traceimport"
version = "0.1.0"
description = "Trace Python package imports"
requires-python = ">=3.10"

[project.scripts]
traceimport = "traceimport:main"

[tool.setuptools.packages.find]
where = ["src"]